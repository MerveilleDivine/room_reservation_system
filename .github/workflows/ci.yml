name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore RoomReservations.slnx
      - run: dotnet test RoomReservations.slnx --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Start the browser service
        timeout-minutes: 5
        run: |
          roomwise_playwright_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          docker run --detach --interactive --rm --init --name roomwise-browser \
            --shm-size=1g --network host --volume "$PWD:/work" --workdir /work \
            "mcr.microsoft.com/playwright:v${roomwise_playwright_version}-noble" \
            ./node_modules/.bin/playwright run-server --host 127.0.0.1 --port 3000
          curl --fail --retry 20 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3000/json
      - run: npm run test:e2e
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
      - name: Browser service logs
        if: ${{ failure() }}
        run: docker logs roomwise-browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: roomwise-browser-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker build --file Dockerfile.vercel --tag roomwise:ci .
      - run: npm ci
        working-directory: web
      - name: Start the published app
        run: docker run --detach --rm --name roomwise --publish 127.0.0.1:8080:8080 roomwise:ci
      - name: Wait for the real API
        run: curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/api/health
      - name: Verify the single-host app in Chromium
        timeout-minutes: 5
        working-directory: web
        run: |
          roomwise_playwright_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          docker run --rm --init --shm-size=1g --network host \
            --volume "$PWD:/work" --workdir /work \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:8080 \
            "mcr.microsoft.com/playwright:v${roomwise_playwright_version}-noble" npm run test:e2e
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs roomwise
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: roomwise-container-browser-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
